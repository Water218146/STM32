<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能终端管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>智能终端管理系统</h1>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">未连接</span>
            </div>
        </header>

        <!-- 连接配置区域 -->
        <section class="connection-panel">
            <div class="mode-selector">
                <label>
                    <input type="radio" name="connectMode" value="manual" checked>
                    手动输入
                </label>
                <label>
                    <input type="radio" name="connectMode" value="quick">
                    快速连接
                </label>
            </div>

            <!-- 手动输入模式 -->
            <div id="manualMode" class="mode-content">
                <div class="input-group">
                    <label for="serverAddress">服务器地址</label>
                    <input type="text" id="serverAddress" value="localhost" placeholder="例如: localhost">
                </div>
                <div class="input-group">
                    <label for="serverPort">端口</label>
                    <input type="number" id="serverPort" value="8080" placeholder="例如: 8080">
                </div>
            </div>

            <!-- 快速连接模式 -->
            <div id="quickMode" class="mode-content" style="display: none;">
                <div class="input-group" style="flex: 1;">
                    <label for="quickAddress">域名</label>
                    <input type="text" id="quickAddress" value="www.water21.top" placeholder="例如: www.water21.top">
                    <small style="color: #64748b; margin-top: 4px;">自动连接到 8080 端口</small>
                </div>
            </div>

            <button class="btn btn-primary" id="connectBtn">连接</button>
        </section>

        <!-- 客户端信息 -->
        <section class="client-info" id="clientInfo" style="display: none;">
            <span>客户端ID: <strong id="clientId">-</strong></span>
        </section>

        <!-- 消息显示区域 -->
        <section class="messages-panel">
            <div class="messages-header">
                <h2>消息记录</h2>
                <button class="btn btn-small" id="clearBtn">清空</button>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div class="message system">
                    <span class="message-prefix">[系统]</span>
                    <span class="message-content">欢迎使用智能终端管理系统</span>
                </div>
            </div>
        </section>

        <!-- 消息发送区域 -->
        <section class="send-panel">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="输入消息..." disabled>
                <button class="btn btn-send" id="sendBtn" disabled>发送</button>
            </div>
        </section>

        <!-- 在线用户统计 -->
        <footer class="footer">
            <span id="onlineCount">在线用户: 0</span>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
